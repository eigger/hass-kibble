name: Validate
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@7528a90b483a6740c0b1bdd9176f3e33355eb385 # reviewed standards commit
