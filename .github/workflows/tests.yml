name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@4fa557eaa7142b87a6cae8b09c249cf50c3865c6 # reviewed standards commit
    with:
      standards-ref: 4fa557eaa7142b87a6cae8b09c249cf50c3865c6
      domain: kibble
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'button sensor'
      pytest-args: tests/components/kibble/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@4fa557eaa7142b87a6cae8b09c249cf50c3865c6 # reviewed standards commit
    with:
      standards-ref: 4fa557eaa7142b87a6cae8b09c249cf50c3865c6
      domain: kibble
      python-versions: '["3.13"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.3.0'
      test-profile: ha
      ha-components: 'button sensor'
      pytest-args: tests/components/kibble/ -v
